<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Games Viewer</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
  <header>
    <h1>Games</h1>
    <p class="subtitle">Browse and filter games from Games.csv</p>
  </header>

  <section class="controls">
    <label>Team filter: <input id="teamFilter" placeholder="team name"></label>
    <label>Search: <input id="search" placeholder="text search"></label>
    <label>Page size: <select id="pageSize"><option>25</option><option selected>50</option><option>100</option><option>250</option></select></label>
    <button id="clear">Clear</button>
  </section>

  <main id="tableWrap">Loading data…</main>

  <nav id="pager" class="pager" aria-label="Pagination" style="display:none">
    <button id="prev">Prev</button>
    <span id="pageInfo"></span>
    <button id="next">Next</button>
  </nav>

  <div id="spinner" class="spinner" aria-hidden="true" style="display:none">Loading…</div>

  <script src="app.js"></script>
</body>
</html>
